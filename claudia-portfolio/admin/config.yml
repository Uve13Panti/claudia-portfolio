# Login con GitHub (OAuth gestionado por Netlify).
# Quien tenga acceso de escritura al repo puede entrar en tusitio.netlify.app/admin
backend:
  name: github
  repo: Uve13Panti/claudia-portfolio
  branch: main

# Panel en español para Claudia
locale: "es"

# El repo tiene los archivos dentro de la subcarpeta "claudia-portfolio",
# por eso las rutas de guardado la incluyen. La ruta pública NO la incluye,
# porque Netlify publica desde dentro de esa subcarpeta.
media_folder: "claudia-portfolio/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "work"
    label: "Work / Portfolio"
    description: "Añade, edita o borra looks y piezas de diseño de la página Work."
    files:
      - name: "work"
        label: "Piezas del portfolio"
        file: "claudia-portfolio/data/work.json"
        fields:
          - label: "Piezas"
            name: "items"
            widget: "list"
            label_singular: "Pieza"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Categoría", name: "category", widget: "select", options: ["Styling", "Design"] }
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Descripción", name: "description", widget: "text" }

  - name: "services"
    label: "Services"
    description: "Añade, edita o borra los servicios de la página Services."
    files:
      - name: "services"
        label: "Lista de servicios"
        file: "claudia-portfolio/data/services.json"
        fields:
          - label: "Servicios"
            name: "items"
            widget: "list"
            label_singular: "Servicio"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
